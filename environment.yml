name: edu2-rag
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.10,<3.12
  - pip
  - tesseract
  - poppler
  - pip:
      # ==============================================================================
      # Layer 1: Document Probing, Language Detection & PDF Processing
      # ==============================================================================
      - pymupdf>=1.23.0
      - pillow>=10.0.0
      - pytesseract>=0.3.10
      - langdetect>=1.0.9
      - python-dotenv>=1.0.0
      - requests>=2.31.0

      # ==============================================================================
      # Layer 2: Fast Local & Spatial PDF Parsers
      # ==============================================================================
      - liteparse>=2.14.0
      - docling>=1.0.0

      # ==============================================================================
      # Layer 3: Data Schema & Validation
      # ==============================================================================
      - pydantic>=2.0.0

      # ==============================================================================
      # Layer 4: FastAPI Microservice & Streamlit Studio
      # ==============================================================================
      - fastapi>=0.100.0
      - uvicorn>=0.22.0
      - python-multipart>=0.0.6
      - streamlit>=1.30.0

      # ============================================================================== 
      # Layer 5: Testing
      # ============================================================================== 
      - pytest>=7.0.0
